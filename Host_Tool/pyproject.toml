[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stc32g-fastboot"
version = "1.0.22"
description = "STC32G144K246 FastBoot Turbo incremental CRC32/status CLI and Textual TUI"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "textual>=0.58,<2"]

[project.scripts]
stcfastboot = "stcfastboot.cli:main"
